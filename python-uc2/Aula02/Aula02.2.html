<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Estrutura HTML5 com Bootstrap e Font Awesome</title>
    <meta name="description" content="Uma página de exemplo para demonstrar a estrutura básica do HTML5 com Bootstrap e Font Awesome.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <!-- Estilos personalizados (opcional) -->
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>

    <section>
        <h1>Exemplo de uso de Imagem</h1>
        <img src="img/paisagem.jpg" alt="Por do Sol - Praia Grande - Arraial do Cabo"
            width="600px"
            title="Por do Sol - Praia Grande - Arraial do Cabo">
    </section>
    
    <section>
        <h4>2ª Imagem</h4>
        <figure>
            <img src="img/bird-8450958_1920.png" height="300px" alt="Aqui tem uma Paisagem">
            <figcaption>Figura 1: Imagem de uma ave</figcaption>
        </figure>
        <hr>
    </section>
    
    <section>
        <h4>Aviso de Segurança</h4>
        <figure>
            <img src="img/banner-seguranca-001.png" height="200px" alt="Aqui tem uma imagem">
            <figcaption>Figura 2: Alerta de Segurança</figcaption>
        </figure>
        <hr>
    </section>
    <section>
        <h4>Presente de Natal</h4>
        <figure>
            <img src="img/christmas-6805045_1920.jpg" height="300px" alt="Presente de Natal">
            <figcaption>Figura 3: Presente de Natal</figcaption>
        </figure>
        <hr>
    </section>
    <section>
        <h4>Montanhas</h4>
        <figure>
            <img src="img/mountains-3324569_1920.jpg" height="300px" alt="Montanhas">
            <figcaption>Figura 4: Montanhas</figcaption>
        </figure>
        <hr>
    </section>
    </section>


    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
